<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantum Tic-Tac-Toe</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0d1117;
        color: #f5f7fb;
        font: 16px/1.5 "Avenir Next", "Segoe UI", sans-serif;
      }

      main {
        width: min(32rem, calc(100vw - 3rem));
        padding: 2rem;
        border-radius: 1.25rem;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.6rem;
      }

      p {
        margin: 0;
        color: rgba(245, 247, 251, 0.82);
      }

      code {
        font-family: "SFMono-Regular", Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Frontend build unavailable</h1>
      <p>Run <code>npm run client:build</code> or start the Vite client dev server.</p>
    </main>
  </body>
</html>
