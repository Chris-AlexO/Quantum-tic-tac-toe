name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qttt
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project health checks
        run: npm run check:project

      - name: Run tests
        run: npm test

      - name: Build client
        run: npm run client:build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e
        env:
          QTTT_DB_HOST: 127.0.0.1
          QTTT_DB_PORT: 5432
          QTTT_DB_NAME: qttt
          QTTT_DB_USER: postgres
          QTTT_DB_PASSWORD: postgres
          QTTT_DB_SCHEMA: public
          QTTT_DB_SSL_MODE: disable
